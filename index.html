<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edoardo Zaffaroni - Homeworks</title>
    <style>
      :root {
        --bg-dark: #0a0a0a;
        --card-bg: #141414;
        --gold: #d4af37;
        --gold-light: #f1c40f;
        --text-main: #e0e0e0;
      }

      body {
        font-family: 'Inter', -apple-system, sans-serif;
        background-color: var(--bg-dark);
        color: var(--text-main);
        margin: 0;
        padding: 60px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      h1 {
        font-size: 2.5rem;
        margin-bottom: 50px;
        letter-spacing: 2px;
        text-transform: uppercase;
        background: linear-gradient(to right, var(--gold), #fff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      section {
        width: 100%;
        max-width: 800px;
        margin-bottom: 40px;
      }

      h2 {
        font-size: 0.9rem;
        color: var(--gold);
        margin-bottom: 20px;
        text-transform: uppercase;
        letter-spacing: 3px;
        border-bottom: 1px solid #333;
        padding-bottom: 10px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 20px;
      }

      .card {
        background: var(--card-bg);
        padding: 25px 15px;
        border-radius: 8px;
        text-align: center;
        text-decoration: none;
        color: var(--text-main);
        font-weight: 500;
        border: 1px solid #222;
        transition: all 0.4s ease;
        position: relative;
        overflow: hidden;
      }

      .card:hover {
        border-color: var(--gold);
        color: var(--gold);
        box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        transform: translateY(-5px);
      }
    </style>
  </head>
  <body>
    <h1>Homeworks</h1>

    <section>
      <h2>Esercizi 01</h2>
      <div class="grid">
        <a href="es01/a.html" class="card">Es 01a</a>
        <a href="es01/b.html" class="card">Es 01b</a>
        <a href="es01/c.html" class="card">Es 01c</a>
      </div>
    </section>

    <section>
      <h2>Esercizi 02</h2>
      <div class="grid">
        <a href="es02/a.html" class="card">Es 02a</a>
        <a href="es02/b.html" class="card">Es 02b</a>
        <a href="es02/c.html" class="card">Es 02c</a>
      </div>
    </section>

    <section>
      <h2>Esercizi 03</h2>
      <div class="grid">
        <a href="es03/a.html" class="card">Es 03a</a>
        <a href="es03/b.html" class="card">Es 03b</a>
        <a href="es03/c.html" class="card">Es 03c</a>
        <a href="es03/d.html" class="card">Es 03d</a>
        <a href="es03/e.html" class="card">Es 03e</a>
      </div>
    </section>
  </body>
</html>
