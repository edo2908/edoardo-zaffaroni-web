<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edoardo Zaffaroni</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-dark: #050505;
        --card-bg: rgba(255, 255, 255, 0.03);
        --card-border: rgba(255, 255, 255, 0.1);
        --gold: #d4af37;
        --gold-glow: rgba(212, 175, 55, 0.3);
        --text-main: #f0f0f0;
        --text-muted: #888;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-dark);
        color: var(--text-main);
        margin: 0;
        padding: 80px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        background-image: radial-gradient(circle at 50% -20%, #1a1a1a 0%, #050505 80%);
      }

      h1 {
        font-size: clamp(2rem, 5vw, 3rem);
        margin-bottom: 60px;
        font-weight: 600;
        letter-spacing: -1px;
        background: linear-gradient(135deg, #fff 0%, var(--gold) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-align: center;
      }

      section {
        width: 100%;
        max-width: 900px;
        margin-bottom: 60px;
        animation: fadeIn 0.8s ease forwards;
      }

      h2 {
        font-size: 0.8rem;
        color: var(--text-muted);
        margin-bottom: 25px;
        text-transform: uppercase;
        letter-spacing: 4px;
        display: flex;
        align-items: center;
        gap: 15px;
      }

      h2::after {
        content: "";
        height: 1px;
        flex-grow: 1;
        background: linear-gradient(to right, rgba(212, 175, 55, 0.5), transparent);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 15px;
      }

      .card {
        background: var(--card-bg);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        padding: 30px 20px;
        border-radius: 12px;
        text-align: center;
        text-decoration: none;
        color: var(--text-main);
        font-weight: 400;
        border: 1px solid var(--card-border);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      .card::before {
        content: '→';
        position: absolute;
        right: 15px;
        opacity: 0;
        transform: translateX(-10px);
        transition: all 0.3s ease;
        color: var(--gold);
      }

      .card:hover {
        border-color: var(--gold);
        background: rgba(212, 175, 55, 0.05);
        transform: translateY(-8px);
        box-shadow: 0 10px 30px -10px var(--gold-glow);
      }

      .card:hover::before {
        opacity: 1;
        transform: translateX(0);
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      section:nth-child(2) { animation-delay: 0.1s; }
      section:nth-child(3) { animation-delay: 0.2s; }
      section:nth-child(4) { animation-delay: 0.3s; }

      @media (max-width: 480px) {
        .grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <h1>Esercizi</h1>

    <section>
      <h2>Esercizio 03</h2>
      <div class="grid">
        <a href="ES03/a.html" class="card">Es A</a>
        <a href="ES03/b.html" class="card">Es B</a>
        <a href="ES03/c.html" class="card">Es C</a>
        <a href="ES03/d.html" class="card">Es D</a>
        <a href="ES03/e.html" class="card">Es E</a>
      </div>
    </section>
  </body>
</html>
