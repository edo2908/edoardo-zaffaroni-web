<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />

    <title>Edoardo Zaffaroni - Homeworks</title>
    <style>
      body {
        font-family: 'Inter', system-ui, sans-serif;
        background-color: #f0f2f5;
        color: #1a1a1a;
        margin: 0;
        padding: 40px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      h1 { margin-bottom: 40px; }

      section {
        width: 100%;
        max-width: 800px;
        margin-bottom: 30px;
      }

      h2 {
        font-size: 1.2rem;
        color: #666;
        border-left: 4px solid #3498db;
        padding-left: 10px;
        margin-bottom: 15px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 15px;
      }

      .card {
        background: white;
        padding: 20px;
        border-radius: 12px;
        text-align: center;
        text-decoration: none;
        color: #333;
        font-weight: 600;
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        border: 1px solid rgba(0,0,0,0.05);
      }

      .card:hover {
        background: #3498db;
        color: white;
        transform: translateY(-5px);
        box-shadow: 0 10px 15px rgba(52, 152, 219, 0.3);
      }
    </style>
  </head>

      </div>
    </section>

    <section>
      <h2>Esercizi 03</h2>
      <div class="grid">

        <a href="es03/b.html" class="card">Es 03b</a>

        <a href="es03/d.html" class="card">Es 03d</a>
