<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Esercizio D</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        input[type="text"] {
            padding: 10px;
            font-size: 16px;
            width: 300px;
            border: 2px solid #333;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h1>Esercizio D</h1>
    <p>Scrivi nella casella di testo per convertire i caratteri in maiuscolo:</p>

    <input type="text" id="campoTesto" oninput="convertiInMaiuscolo(this)" placeholder="Scrivi qualcosa...">

    <script>
        // Funzione semplice per convertire il testo in maiuscolo
        function convertiInMaiuscolo(input) {
            // Prende il valore corrente, lo trasforma in maiuscolo e lo risolleva nell'input
            input.value = input.value.toUpperCase();
        }
    </script>

</body>
</html>
