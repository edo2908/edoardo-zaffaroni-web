<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Esercizio D</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        .spazio {
            margin-bottom: 20px;
        }
        /* METODO 1: Forza la visualizzazione in maiuscolo tramite CSS */
        .solo-css {
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <h1>Esercizio D</h1>

    <div class="spazio">
        <label for="inputCSS">1. Trasformazione immediata (solo estetica con CSS):</label><br>
        <input type="text" id="inputCSS" class="solo-css" placeholder="Scrivi qui...">
    </div>

    <div class="spazio">
        <label for="inputJS">2. Trasformazione reale del valore (con JavaScript):</label><br>
        <input type="text" id="inputJS" placeholder="Scrivi qui...">
    </div>

    <script>
        // Seleziono la seconda casella di testo
        const campoTesto = document.getElementById('inputJS');

        // Ascolto l'evento 'input' (ogni volta che l'utente digita una lettera)
        campoTesto.addEventListener('input', function() {
            // Prendo il testo inserito, lo converto in maiuscolo e lo riscrivo nella casella
            this.value = this.value.toUpperCase();
        });
    </script>

</body>
</html>
