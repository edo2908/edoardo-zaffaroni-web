<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Esercizio C</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        /* Stile per il primo pulsante (Blu) */
        .btn-blu {
            background-color: #007acc; /* Colore dello sfondo */
            color: #ffffff;            /* Colore del testo */
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-right: 10px;
        }
        /* Cambia colore quando il mouse passa sopra */
        .btn-blu:hover {
            background-color: #005999;
        }

        /* Stile per il secondo pulsante (Verde) */
        .btn-verde {
            background-color: #2ea44f; /* Colore dello sfondo */
            color: #ffffff;            /* Colore del testo */
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-right: 10px;
        }
        .btn-verde:hover {
            background-color: #227d3c;
        }

        /* Stile per il terzo pulsante (Arancione) */
        .btn-arancio {
            background-color: #ff9900; /* Colore dello sfondo */
            color: #111111;            /* Colore del testo (scuro per contrasto) */
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn-arancio:hover {
            background-color: #e68a00;
        }
    </style>
</head>
<body>

    <h1>Esercizio C</h1>
    <p>Pulsanti personalizzati con CSS:</p>

    <button class="btn-blu">Pulsante Blu</button>
    <button class="btn-verde">Pulsante Verde</button>
    <button class="btn-arancio">Pulsante Arancione</button>

</body>
</html>
