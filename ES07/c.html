<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Esercizio C</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        /* Stile iniziale dei pulsanti */
        .bottone {
            padding: 12px 24px;
            font-size: 16px;
            margin-right: 10px;
            cursor: pointer;
            border: 2px solid #333;
            background-color: #ffffff; /* Sfondo iniziale bianco */
            color: #333;               /* Testo iniziale scuro */
            border-radius: 5px;
            transition: background-color 0.3s; /* Rende il cambio di colore fluido */
        }
    </style>
</head>
<body>

    <h1>Esercizio C</h1>
    <p>Clicca sui pulsanti per cambiare il loro colore di sfondo:</p>

    <button class="bottone" onclick="cambiaColore(this, 'coral')">Pulsante 1</button>
    <button class="bottone" onclick="cambiaColore(this, 'gold')">Pulsante 2</button>
    <button class="bottone" onclick="cambiaColore(this, 'lightgreen')">Pulsante 3</button>

    <script>
        // Funzione semplice per cambiare colore
        function cambiaColore(elementoPulsante, colore) {
            // Modifica lo sfondo del pulsante cliccato con il colore passato come argomento
            elementoPulsante.style.backgroundColor = colore;
            
            // Opzionale: cambia il colore del testo in bianco se lo sfondo diventa scuro
            elementoPulsante.style.color = '#000000';
        }
    </script>

</body>
</html>
