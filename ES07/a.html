<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Esercizio A</title>
</head>
<body>

    <h1>Esercizio A</h1>

    <script>
// Mostra le dimensioni della finestra dell'utente
console.log("Larghezza della finestra:", window.innerWidth + "px");
console.log("Altezza della finestra:", window.innerHeight + "px");

// Mostra l'indirizzo della pagina corrente
console.log("URL della pagina:", window.location.href);

// Mostra la lingua del browser
console.log("Lingua del browser:", window.navigator.language);

// Mostra se l'utente è connesso a internet
console.log("Sei online?:", window.navigator.onLine);
</script>

</body>
</html>
