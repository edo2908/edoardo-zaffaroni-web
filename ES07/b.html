<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Esercizio B</title>
</head>
<body>

    <h1>Esercizio B</h1>

    <script>
        // Mostra il nome in codice e il nome ufficiale del browser
        console.log("Nome in codice browser:", window.navigator.appCodeName);
        console.log("Nome ufficiale browser:", window.navigator.appName);

        // Mostra la lingua impostata nel browser
        console.log("Lingua del browser:", window.navigator.language);

        // Mostra il sistema operativo / piattaforma in uso
        console.log("Piattaforma:", window.navigator.platform);

        // Mostra la stringa User Agent (dettagli completi su browser e OS)
        console.log("User Agent:", window.navigator.userAgent);

        // Mostra lo stato della connessione e dei cookie
        console.log("Sei online?:", window.navigator.onLine ? "Sì" : "No");
        console.log("Cookie abilitati?:", window.navigator.cookieEnabled ? "Sì" : "No");
    </script>
  
</body>
</html>
