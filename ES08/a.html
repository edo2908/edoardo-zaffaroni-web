<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Esercizio A</title>
</head>
<body>

    <h1>Esercizio A</h1>
    
    <button id="mioPulsante">Pulsante di Esempio</button>

    <script>
        const bottone = document.getElementById('mioPulsante');

        // Passaggio del mouse
        bottone.addEventListener('mouseover', function() {
            bottone.style.backgroundColor = '#4CAF50';
            bottone.style.color = 'white';
        });

        // Uscita del mouse
        bottone.addEventListener('mouseout', function() {
            bottone.style.backgroundColor = '';
            bottone.style.color = '';
        });
    </script>

</body>
</html>
