<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Esercizio B</title>
</head>
<body>

    <h1>Esercizio B</h1>

    <label for="codice_fiscale">Codice Fiscale:</label>
    <input type="text" id="codice_fiscale" placeholder="Inserisci codice fiscale">

    <script>
        const inputCF = document.getElementById('codice_fiscale');

        inputCF.addEventListener('input', function() {
            inputCF.value = inputCF.value.toUpperCase();
        });
    </script>

</body>
</html>
