<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ES08</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: #f3f4f6;
            color: #1f2937;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 550px;
            background: white;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        h2 {
            margin-top: 0;
            margin-bottom: 24px;
            color: #111827;
            font-size: 1.5rem;
            font-weight: 700;
            border-bottom: 2px solid #f3f4f6;
            padding-bottom: 12px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 0.9rem;
            color: #4b5563;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px 14px;
            box-sizing: border-box;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 0.95rem;
            background-color: #fff;
            color: #111827;
            transition: all 0.2s ease-in-out;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        input[readonly] {
            background-color: #f9fafb;
            color: #6b7280;
            cursor: not-allowed;
            border-style: dashed;
        }
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }
        button {
            flex: 1;
            padding: 10px 16px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        #btn-email {
            background-color: #4b5563;
        }
        #btn-email:hover {
            background-color: #374151;
        }
        .error-message {
            color: #dc2626;
            font-size: 0.85rem;
            margin-top: 6px;
            display: none;
            font-weight: 500;
        }
        #output {
            margin-top: 24px;
            padding: 14px 16px;
            background: #eff6ff;
            border-left: 4px solid #2563eb;
            border-radius: 0 8px 8px 0;
            min-height: 24px;
            font-size: 0.9rem;
            color: #1e40af;
            line-height: 1.5;
        }
        .progress-container {
            width: 100%;
            background-color: #e5e7eb;
            border-radius: 9999px;
            height: 6px;
            margin-top: 8px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease, background-color 0.3s ease;
        }
        #testo-nascondere {
            margin-top: 15px;
            padding: 10px;
            background-color: #f3f4f6;
            border-radius: 6px;
            text-align: center;
            font-size: 0.9rem;
            color: #4b5563;
            cursor: pointer;
            border: 1px dashed #d1d5db;
            transition: all 0.2s ease;
        }
        #testo-nascondere:hover {
            background-color: #fee2e2;
            color: #991b1b;
            border-color: #f87171;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Esercizi ES08</h2>

    <div class="form-group">
        <label for="codice_fiscale">Codice Fiscale:</label>
        <input type="text" id="codice_fiscale" placeholder="Inserisci codice fiscale">
    </div>

    <div class="form-group">
        <label for="input_focus">Casella di Testo Focus/Blur:</label>
        <input type="text" id="input_focus" placeholder="Cliccami per il focus">
    </div>

    <div class="form-group">
        <label for="vecchia_password">Vecchia Password:</label>
        <input type="password" id="vecchia_password" value="PasswordVecchia123!">
    </div>

    <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="Inserisci password">
        <div class="progress-container">
            <div id="password-strength-bar" class="progress-bar"></div>
        </div>
    </div>

    <div class="form-group">
        <label for="ripetipassword">Ripeti Password:</label>
        <input type="password" id="ripetipassword" placeholder="Ripeti la password">
        <div id="error-password" class="error-message">Le password non corrispondono!</div>
    </div>

    <div class="form-group">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" placeholder="Inserisci Nome">
    </div>

    <div class="form-group">
        <label for="cognome">Cognome:</label>
        <input type="text" id="cognome" placeholder="Inserisci Cognome">
    </div>

    <div class="form-group">
        <label for="email">Indirizzo Posta Elettronica Generato:</label>
        <input type="text" id="email" placeholder="email.generata@dominio.it" readonly>
    </div>

    <div class="form-group button-group">
        <button id="btn-output">Visualizza Messaggio</button>
        <button id="btn-email">Componi Email</button>
    </div>

    <div class="form-group">
        <p id="testo-nascondere">Fare clic qui per nascondere questo testo</p>
    </div>

    <div id="output">I messaggi di output appariranno qui...</div>
</div>

<script>
    const codiceFiscaleInput = document.getElementById('codice_fiscale');
    codiceFiscaleInput.addEventListener('input', function() {
        this.value = this.value.toUpperCase();
    });

    const inputFocus = document.getElementById('input_focus');
    inputFocus.addEventListener('focus', function() {
        this.style.backgroundColor = '#fef08a';
    });
    inputFocus.addEventListener('blur', function() {
        this.style.backgroundColor = '';
    });

    const testoNascondere = document.getElementById('testo-nascondere');
    testoNascondere.addEventListener('click', function() {
        this.hidden = true;
    });

    const passwordInput = document.getElementById('password');
    const ripetiPasswordInput = document.getElementById('ripetipassword');
    const errorPassword = document.getElementById('error-password');

    function controllaPassword() {
        if (ripetiPasswordInput.value !== '' && ripetiPasswordInput.value !== passwordInput.value) {
            errorPassword.style.display = 'block';
        } else {
            errorPassword.style.display = 'none';
        }
    }
    ripetiPasswordInput.addEventListener('input', controllaPassword);
    passwordInput.addEventListener('input', controllaPassword);

    const progressBar = document.getElementById('password-strength-bar');
    const outputDiv = document.getElementById('output');
    const vecchiaPasswordInput = document.getElementById('vecchia_password');

    passwordInput.addEventListener('change', function() {
        const val = this.value;
        let punteggio = 0;

        if (val.length >= 8) punteggio++;
        if (/[A-Z]/.test(val)) punteggio++;
        if (/[a-z]/.test(val)) punteggio++;
        if (/[0-9]/.test(val)) punteggio++;
        if (/[^A-Za-z0-9]/.test(val)) punteggio++;

        progressBar.style.width = (punteggio * 20) + '%';

        if (punteggio <= 2) {
            this.style.backgroundColor = '#ffeeef';
            this.style.borderColor = '#f87171';
            progressBar.style.backgroundColor = '#ef4444';
        } else if (punteggio <= 4) {
            this.style.backgroundColor = '#fffbeb';
            this.style.borderColor = '#fbbf24';
            progressBar.style.backgroundColor = '#f59e0b';
        } else {
            this.style.backgroundColor = '#f0fdf4';
            this.style.borderColor = '#4ade80';
            progressBar.style.backgroundColor = '#22c55e';
        }

        let messaggioSimile = "";
        if (val === vecchiaPasswordInput.value) {
            messaggioSimile = " <br>⚠️ Attenzione: La nuova password è identica alla precedente!";
            this.style.backgroundColor = '#ffeeef';
            this.style.borderColor = '#f87171';
        }

        if (punteggio === 5) {
            outputDiv.innerHTML = `Forza Password: Requisiti superati al massimo! (Punteggio: ${punteggio}/5).${messaggioSimile}`;
        } else {
            outputDiv.innerHTML = `Forza Password aggiornata. Punteggio: ${punteggio}/5.${messaggioSimile}`;
        }
    });

    const btnOutput = document.getElementById('btn-output');
    btnOutput.addEventListener('click', function() {
        outputDiv.textContent = "Il pulsante è stato premuto con successo!";
    });

    function generaEmail() {
        const nome = document.getElementById('nome').value.trim();
        const cognome = document.getElementById('cognome').value.trim();
        const emailInput = document.getElementById('email');

        if (nome !== "" && cognome !== "") {
            let emailGenerata = `${nome}.${cognome}@dominio.it`.toLowerCase();
            emailGenerata = emailGenerata.replace(/\s+/g, ''); 
            emailInput.value = emailGenerata;
            return emailGenerata;
        }
        return null;
    }

    const btnEmail = document.getElementById('btn-email');
    btnEmail.addEventListener('click', function() {
        const email = generaEmail();
        if (email) {
            outputDiv.textContent = `Email generata: ${email}`;
        } else {
            outputDiv.textContent = "Inserisci sia il nome che il cognome per generare l'email.";
        }
    });

    document.getElementById('nome').addEventListener('change', function() {
        generaEmail();
    });
    document.getElementById('cognome').addEventListener('change', function() {
        generaEmail();
    });
</script>

</body>
</html>
